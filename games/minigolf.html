  if(b.x<MGB.x+MGR){b.x=MGB.x+MGR;b.vx=Math.abs(b.vx)*.78;}if(b.x>MGB.x+MGB.w-MGR){b.x=MGB.x+MGB.w-MGR;b.vx=-Math.abs(b.vx)*.78;}
