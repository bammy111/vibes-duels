<style>

  h('polygon',{points:'6,6 6,9 7.5,7.5',fill:CO[0].col}),h('polygon',{points:'6,6 9,6 7.5,7.5',fill:CO[1].col}),h('polygon',{points:'9,6 9,9 7.5,7.5',fill:CO[2].col}),h('polygon',{points:'6,9 9,9 7.5,7.5',fill:CO[3].col}),
