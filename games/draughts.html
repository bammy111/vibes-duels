<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<title>Draughts Duel – 1v1 Cash Wager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{--bg:#10201A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130E}}
:root[data-theme="dark"]{--bg:#08130E}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100%;background:var(--bg);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.up{animation:up .25s ease-out}
@keyframes ring{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,200,61,.35)}50%{box-shadow:inset 0 0 0 3px rgba(255,200,61,.95)}}
.movable{animation:ring 1.2s infinite}
.pc{transition:left .35s ease,top .35s ease}
@media (prefers-reduced-motion:reduce){.pop,.up,.movable,.pc{animation:none;transition:none}}

</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React,h=React.createElement;
const d=(c,...k)=>h('div',{className:c},...k);
const money=n=>'₦'+Math.round(n).toLocaleString('en-NG');
let PID=0;
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]],inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8,fwd=k=>k==='w'?-1:1,base=k=>k==='w'?0:7,cp=b=>b.map(r=>[...r]);
const fresh=()=>{const b=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)b[r][c]={id:PID++,c:'b',k:false};else if(r>4)b[r][c]={id:PID++,c:'w',k:false};}return b;};
const count=(b,k)=>b.flat().filter(p=>p&&p.c===k).length;
function jumps(b,r,c,col,king,caps){const out=[],isCap=(x,y)=>caps.some(q=>q[0]===x&&q[1]===y);
 if(!king){const dr=fwd(col);for(const dc of[-1,1]){const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;if(inb(lr,lc)&&b[mr][mc]&&b[mr][mc].c!==col&&!isCap(mr,mc)&&!b[lr][lc])out.push({to:[lr,lc],cap:[mr,mc]});}}
 else for(const[dr,dc]of DIRS){let x=r+dr,y=c+dc;while(inb(x,y)&&!b[x][y])x+=dr,y+=dc;
  if(!inb(x,y)||b[x][y].c===col||isCap(x,y))continue;const cx=x,cy=y;x+=dr;y+=dc;while(inb(x,y)&&!b[x][y]){out.push({to:[x,y],cap:[cx,cy]});x+=dr;y+=dc;}}
 return out;}
function chains(b,r,c,col,king,caps,path){const js=jumps(b,r,c,col,king,caps);if(!js.length)return caps.length?[{path,caps}]:[];
 let res=[];for(const j of js){const[x,y]=j.to,nc=[...caps,j.cap];
  if(!king&&x===base(col))res.push({path:[...path,j.to],caps:nc,promo:true});else res.push(...chains(b,x,y,col,king,nc,[...path,j.to]));}return res;}
function genSeqs(b,col){const caps=[],steps=[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p||p.c!==col)continue;
  const b2=cp(b);b2[r][c]=null;const ch=chains(b2,r,c,col,p.k,[],[[r,c]]);caps.push(...ch);
  if(!p.k){const x=r+fwd(col);for(const dc of[-1,1]){const y=c+dc;if(inb(x,y)&&!b[x][y])steps.push({path:[[r,c],[x,y]],caps:[],promo:x===base(col)});}}
  else for(const[dr,dc]of DIRS){let x=r+dr,y=c+dc;while(inb(x,y)&&!b[x][y]){steps.push({path:[[r,c],[x,y]],caps:[]});x+=dr;y+=dc;}}}
 return caps.length?caps:steps;}
function applyStep(b,[r,c],[x,y]){const n=cp(b),p=n[r][c];n[r][c]=null;const dr=Math.sign(x-r),dc=Math.sign(y-c);let i=r+dr,j=c+dc;while(i!==x||j!==y){if(n[i][j]&&n[i][j].c!==p.c)n[i][j]=null;i+=dr;j+=dc;}n[x][y]=p;return n;}
function promote(b,[x,y]){const p=b[x][y];if(p&&!p.k&&x===base(p.c)){const n=cp(b);n[x][y]={...p,k:true};return n;}return b;}
const applySeq=(b,s)=>{let n=b;for(let i=1;i<s.path.length;i++)n=applyStep(n,s.path[i-1],s.path[i]);return promote(n,s.path[s.path.length-1]);};
const evalB=b=>{let s=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(p){const v=p.k?3.2:1+(p.c==='b'?r:7-r)*.06;s+=p.c==='b'?v:-v;}}return s;};
function mm(b,col,depth,a,be){const ms=genSeqs(b,col);if(!ms.length)return col==='b'?-100-depth:100+depth;if(!depth)return evalB(b);
 if(col==='b'){let best=-1e9;for(const m of ms){best=Math.max(best,mm(applySeq(b,m),'w',depth-1,a,be));a=Math.max(a,best);if(a>=be)break;}return best;}
 let best=1e9;for(const m of ms){best=Math.min(best,mm(applySeq(b,m),'b',depth-1,a,be));be=Math.min(be,best);if(a>=be)break;}return best;}
const matches=(q,pre)=>q.path.length>pre.length&&pre.every((p,i)=>q.path[i][0]===p[0]&&q.path[i][1]===p[1]);
const optsOf=s=>{if(!s.pre)return[];const o={};s.seqs.filter(q=>matches(q,s.pre)).forEach(q=>{const t=q.path[s.pre.length];o[t]=t;});return Object.values(o);};

const Crown=({z})=>h('svg',{viewBox:'0 0 24 24',width:z,height:z,'aria-label':'King'},h('path',{d:'M3 19h18l1.2-11-5.2 4.2L12 5 7 12.2 1.8 8z',fill:'#FFC83D',stroke:'#7A5200',strokeWidth:1.3,strokeLinejoin:'round'}),h('circle',{cx:12,cy:4.6,r:1.4,fill:'#FFC83D',stroke:'#7A5200',strokeWidth:.8}));
const fmt0={phase:'start',stake:1000};

function App(){
 const [scr,setScr]=useState('start'),[stake,setStake]=useState(1000),[rules,setRules]=useState(false),[conf,setConf]=useState(false);
 const [st,setSt]=useState({board:fresh(),turn:'w',seqs:[],sel:null,pre:null,phase:'start',msg:'',quiet:0,winner:null,reason:'',anim:false}),S=useRef(st);
 const upd=f=>{S.current=f(S.current);setSt(S.current);};
 const pool=stake*2,rake=pool*.05,payout=pool-rake;
 const settleTurn=(board,turn,quiet)=>{const seqs=genSeqs(board,turn);
  if(!seqs.length){const w=turn==='w'?'b':'w';upd(s=>({...s,board,seqs:[],sel:null,pre:null,phase:'over',winner:w,reason:count(board,turn)===0?'All pieces captured':'No legal moves — blocked'}));return;}
  if(quiet>=80){upd(s=>({...s,board,seqs:[],sel:null,pre:null,phase:'over',winner:'draw',reason:'No captures or man moves for 40 turns'}));return;}
  const cap=seqs[0].caps.length>0;
  upd(s=>({...s,board,turn,seqs,sel:null,pre:null,quiet,anim:false,phase:'play',msg:turn==='w'?(cap?'Your move — you must capture!':'Your move. Tap a piece.'):'AI is thinking…'}));};
 const begin=()=>{S.current={...S.current,board:fresh(),winner:null,reason:'',conf:false};setConf(false);setScr('game');settleTurn(S.current.board,'w',0);};
 const step=to=>{const s=S.current,pre=s.pre,np=[...pre,to],b=applyStep(s.board,pre[pre.length-1],to);
  const done=s.seqs.find(q=>q.path.length===np.length&&q.path.every((p,i)=>p[0]===np[i][0]&&p[1]===np[i][1]));
  if(done){const moved=s.board[pre[0][0]][pre[0][1]];settleTurn(promote(b,to),'b',done.caps.length||!moved.k?0:s.quiet+1);}
  else upd(s=>({...s,board:b,pre:np,sel:to,msg:'Keep jumping!'}));};
 const click=(r,c)=>{const s=S.current;if(s.phase!=='play'||s.turn!=='w'||s.anim)return;
  if(optsOf(s).some(o=>o[0]===r&&o[1]===c)){step([r,c]);return;}
  if(!s.pre||s.pre.length===1){const p=s.board[r][c];
   if(p&&p.c==='w'&&s.seqs.some(q=>q.path[0][0]===r&&q.path[0][1]===c))upd(s=>({...s,sel:[r,c],pre:[[r,c]]}));else upd(s=>({...s,sel:null,pre:null}));}};
 useEffect(()=>{if(st.phase!=='play'||st.turn!=='b')return;
  const t=setTimeout(()=>{const s=S.current;let best=null,bv=-1e9;
   s.seqs.forEach(m=>{const v=mm(applySeq(s.board,m),'w',3,-1e9,1e9)+Math.random()*.02;if(v>bv){bv=v;best=m;}});
   upd(x=>({...x,anim:true}));let k=1,b=s.board;
   const iv=setInterval(()=>{b=applyStep(b,best.path[k-1],best.path[k]);const last=k===best.path.length-1;if(last)b=promote(b,best.path[k]);
    const kk=k;upd(x=>({...x,board:b,sel:best.path[kk]}));
    if(last){clearInterval(iv);const moved=s.board[best.path[0][0]][best.path[0][1]];setTimeout(()=>settleTurn(b,'w',best.caps.length||!moved.k?0:s.quiet+1),350);}k++;},430);},750);
  return()=>clearTimeout(t);},[st.phase,st.turn]);
 const resign=()=>{if(!conf){setConf(true);return;}upd(s=>({...s,phase:'over',winner:'b',reason:'You resigned',anim:true}));setConf(false);};
 const shell=(...k)=>d('mx-auto flex min-h-screen max-w-[480px] flex-col gap-3 px-3 pb-4 pt-3 relative',...k);

 if(scr==='start')return shell(d('flex flex-1 flex-col items-center justify-center gap-5 py-10 text-center',
  d('text-6xl font-extrabold tracking-tight text-[#FFC83D]','DRAUGHTS'),d('text-sm text-white/80','Classic 1v1 checkers with flying kings. Capture everything or block your rival to take the pot.'),
  d('w-full rounded-3xl bg-white/10 p-4',d('mb-2 text-xs font-bold text-white/70','CHOOSE YOUR STAKE'),
   d('grid grid-cols-4 gap-2',...[500,1000,2000,5000].map(q=>h('button',{key:q,onClick:()=>setStake(q),className:'rounded-xl border-2 py-3 text-sm font-extrabold '+(stake===q?'bg-[#FFC83D] text-[#12231B] border-[#FFC83D]':'border-white/25')},money(q)))),
   d('mt-3 text-xs text-white/70','Escrow pool '+money(pool)+' · winner receives '+money(payout)+' after the 5% fee')),
  h('button',{onClick:begin,className:'w-full rounded-2xl bg-[#FFC83D] py-4 text-lg font-extrabold text-[#12231B] active:scale-[.97]'},'Lock '+money(stake)+' & Play'),
  h('button',{onClick:()=>setRules(true),className:'text-sm text-white/70 underline'},'How to play'),rules&&Rules(()=>setRules(false))));

 const opts=optsOf(st),isOpt=(r,c)=>opts.some(o=>o[0]===r&&o[1]===c);
 const movable=st.phase==='play'&&st.turn==='w'&&!st.pre?st.seqs.map(q=>q.path[0]):[];
 const pieces=[];st.board.forEach((row,r)=>row.forEach((p,c)=>p&&pieces.push({p,r,c})));
 const bar=(k,name)=>{const n=count(st.board,k),kings=st.board.flat().filter(p=>p&&p.c===k&&p.k).length,act=st.turn===k&&st.phase==='play';
  return d('flex items-center gap-3 rounded-2xl px-3 py-2 transition '+(act?'bg-white/15 ring-2 ring-[#FFC83D]':'bg-white/5'),
   d('h-9 w-9 shrink-0 rounded-full border-2',{}.k||'',h('span',{className:'block h-full w-full rounded-full',style:{background:k==='w'?'radial-gradient(circle at 35% 30%,#fff,#E6DFCB 60%,#B9AF94)':'radial-gradient(circle at 35% 30%,#5b5b5b,#1b1b1b 60%,#000)',border:'2px solid '+(k==='w'?'#fff':'#444'),borderRadius:'9999px'}})),
   d('flex-1',d('text-sm font-extrabold',name),d('text-[11px] text-white/60',n+' pieces'+(kings?' · '+kings+' king'+(kings>1?'s':''):''))),
   act&&d('rounded-full bg-[#FFC83D] px-2.5 py-1 text-[11px] font-extrabold text-[#12231B]',k==='w'?'YOUR TURN':'THINKING'));};
 return shell(
  d('sticky top-0 z-10 flex items-center justify-between gap-2 rounded-2xl bg-[#0E7C4B] px-4 py-2.5 shadow-lg',
   d('flex items-center gap-2 text-sm font-extrabold','🔒 Prize pool '+money(pool)),d('text-right text-[11px] leading-tight text-white/85',d('','Winner gets '),d('text-sm font-extrabold text-[#FFC83D]',money(payout)))),
  bar('b','AI Opponent · Black'),
  d('rounded-2xl p-2.5 shadow-2xl',{}.k||'',h('div',{className:'rounded-xl p-2',style:{background:'linear-gradient(135deg,#6B3F1D,#8A5A2B)',boxShadow:'inset 0 2px 6px rgba(0,0,0,.4)'}},
   h('div',{className:'relative aspect-square w-full select-none'},
    h('div',{className:'absolute inset-0',style:{display:'grid',gridTemplateColumns:'repeat(8,1fr)'}},
     ...Array.from({length:64},(_,i)=>{const r=Math.floor(i/8),c=i%8,dark=(r+c)%2===1,sel=st.sel&&st.sel[0]===r&&st.sel[1]===c,mv=movable.some(m=>m[0]===r&&m[1]===c);
      return h('button',{key:i,onClick:dark?()=>click(r,c):undefined,'aria-label':'Square '+'abcdefgh'[c]+(8-r),className:'relative '+(mv?'movable':''),style:{background:dark?'linear-gradient(135deg,#9C5F34,#B87A4A)':'linear-gradient(135deg,#F2DEB8,#E3C795)',boxShadow:sel?'inset 0 0 0 4px #FFC83D':undefined,cursor:dark?'pointer':'default'}},
       dark&&isOpt(r,c)&&h('span',{className:'absolute left-1/2 top-1/2 h-[30%] w-[30%] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#22C55E] shadow',style:{boxShadow:'0 0 0 3px rgba(255,255,255,.55)'}}));})),
    ...pieces.map(({p,r,c})=>h('div',{key:p.id,className:'pc pointer-events-none absolute grid place-items-center',style:{width:'12.5%',height:'12.5%',left:c*12.5+'%',top:r*12.5+'%'}},
     h('div',{className:'grid place-items-center rounded-full',style:{width:'78%',height:'78%',background:p.c==='w'?'radial-gradient(circle at 35% 30%,#fff,#E6DFCB 60%,#B9AF94)':'radial-gradient(circle at 35% 30%,#5f5f5f,#1b1b1b 60%,#000)',boxShadow:'0 3px 5px rgba(0,0,0,.5),inset 0 0 0 3px '+(p.c==='w'?'rgba(150,135,100,.55)':'rgba(255,255,255,.14)')}},
      p.k&&h(Crown,{z:'62%'}))))))),
  bar('w','You · White'),
  d('min-h-[2.4rem] text-center text-sm font-semibold text-white/90',st.msg),
  d('flex items-center justify-between',h('button',{onClick:()=>setRules(true),className:'rounded-xl bg-white/10 px-4 py-2 text-sm font-bold'},'Rules'),
   h('button',{onClick:resign,disabled:st.phase!=='play'||st.turn!=='w',className:'rounded-xl px-4 py-2 text-sm font-bold disabled:opacity-40 '+(conf?'bg-[#DC2626]':'bg-white/10')},conf?'Tap again to resign':'Resign')),
  st.phase==='over'&&d('fixed inset-0 z-30 grid place-items-center bg-black/70 p-5',d('pop w-full max-w-[420px] rounded-[28px] bg-[#FFFBF0] p-6 text-center text-[#12231B]',
   d('text-5xl',st.winner==='w'?'🏆':st.winner==='draw'?'🤝':'😬'),d('mt-2 text-2xl font-extrabold',st.winner==='w'?'You win!':st.winner==='draw'?'Draw':'AI wins this one'),d('text-sm text-[#5C7467]',st.reason),
   st.winner==='draw'?d('mt-4 rounded-2xl bg-[#EAF3ED] p-4 text-sm font-semibold','Both stakes refunded — '+money(stake)+' back to each player. No platform fee.')
   :d('mt-4 space-y-1.5 rounded-2xl bg-[#EAF3ED] p-4 text-sm',...[['Escrow pool (2 × '+money(stake)+')',money(pool)],['Platform fee (5%)','−'+money(rake)],[st.winner==='w'?'Your payout':'AI payout',money(payout)]].map((r,i)=>d('flex justify-between font-semibold '+(i===2?'border-t border-[#C9DBD0] pt-2 text-base font-extrabold text-[#0E7C4B]':''),d('',r[0]),d('',r[1])))),
   st.winner!=='draw'&&d('mt-2 text-sm font-bold '+(st.winner==='w'?'text-[#0E7C4B]':'text-[#C2410C]'),st.winner==='w'?'Net win '+money(payout-stake)+' · paid to your wallet':'You lost your '+money(stake)+' stake'),
   h('button',{onClick:begin,className:'mt-4 w-full rounded-2xl bg-[#0E7C4B] py-3.5 font-extrabold text-white active:scale-95'},'Rematch · lock '+money(stake)),
   h('button',{onClick:()=>setScr('start'),className:'mt-2 w-full py-2 text-sm font-semibold text-[#5C7467]'},'Change stake'))),
  rules&&Rules(()=>setRules(false)));
}
function Rules(close){return d('fixed inset-0 z-40 flex items-end justify-center bg-black/60',d('up max-h-[85%] w-full max-w-[480px] overflow-y-auto rounded-t-[28px] bg-[#FFFBF0] p-5 text-left text-[#12231B]',
 d('mb-2 flex items-center justify-between',d('text-lg font-extrabold','How to play'),h('button',{onClick:close,className:'h-8 w-8 rounded-full bg-[#EAF3ED] font-bold','aria-label':'Close'},'✕')),
 d('space-y-2 text-sm',...[['Setup','You are White (bottom), each side has 12 pieces on the dark squares. White moves first.'],['Moving','Pieces step one square diagonally forward onto an empty dark square. Tap a piece, then a green dot.'],['Capturing','Jump diagonally over an enemy piece into the empty square behind it. Captures are mandatory, and you must keep jumping while you can — tap each landing square.'],['Kings','Reach the far row to be crowned 👑. Kings fly any distance along a diagonal, in any direction, and can capture from a distance.'],['Winning','Capture every enemy piece or leave your rival with no legal move.'],['Draw','40 turns without a capture or a man move ends the game and refunds both stakes.'],['Payout','Winner gets 95% of the pool; 5% is the platform fee.']].map(r=>d('',h('b',null,r[0]+': '),r[1])))));}

</script>
