<script>
const {useState,useRef,useEffect}=React,h=React.createElement;
const d=(c,...k)=>h('div',{className:c},...k);
const money=n=>'₦'+Math.round(n).toLocaleString('en-NG');
const TKW=340,TKH=480,TKG=.18,TKVMAX=11,TKBLAST=26,TKTR=15,TKX=[50,290];
function tkGen(){const h=[],p1=Math.random()*6.28,p2=Math.random()*6.28,p3=Math.random()*6.28;
 for(let x=0;x<TKW;x++){const t=x/TKW;h[x]=300+26*Math.sin(t*6.28*1.3+p1)+15*Math.sin(t*6.28*2.9+p2)+7*Math.sin(t*6.28*6.1+p3)-(95+Math.random()*20)*Math.exp(-Math.pow((x-170)/50,2));}
 for(const cx of TKX){let a=0;for(let x=cx-20;x<=cx+20;x++)a+=h[x];a/=41;for(let x=cx-26;x<=cx+26;x++){const w=Math.max(0,1-Math.max(0,Math.abs(x-cx)-18)/8);h[x]=h[x]*(1-w)+a*w;}}
 for(let k=0;k<2;k++)for(let x=1;x<TKW-1;x++)h[x]=(h[x-1]+h[x]*2+h[x+1])/4;
 return h.map(v=>Math.max(170,Math.min(440,v)));}
const tkH=(h,x)=>h[Math.max(0,Math.min(TKW-1,Math.round(x)))];
function tkCrater(h,cx,cy,r){for(let x=Math.max(0,Math.floor(cx-r));x<=Math.min(TKW-1,Math.ceil(cx+r));x++){const dx=x-cx;if(Math.abs(dx)<=r){const s=Math.sqrt(r*r-dx*dx);if(cy-s<=h[x]+.5)h[x]=Math.min(TKH-6,Math.max(h[x],cy+s));}}}
function tkSim(h,sx,sy,ang,pow){const a=ang*Math.PI/180,v=pow/100*TKVMAX;let x=sx,y=sy,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;
 for(let i=0;i<2400;i++){x+=vx/3;y+=vy/3;vy+=TKG/3;if(x<0||x>=TKW||y>TKH+40)return{x,y,out:true};if(y>=h[Math.floor(x)])return{x,y:h[Math.floor(x)],out:false};}return{x,y,out:true};}
const tkMuzzle=(t,ang)=>[t.x+Math.cos(ang*Math.PI/180)*19,t.y-12-Math.sin(ang*Math.PI/180)*19];
function tkPlan(h,me,foe){let best=null;const tx=foe.x,ty=foe.y-8;
 for(let a=8;a<=172;a+=2)for(let p=20;p<=100;p+=3){const[sx,sy]=tkMuzzle(me,a),r=tkSim(h,sx,sy,a,p);if(r.out)continue;
  const d=Math.hypot(r.x-tx,r.y-ty),self=Math.hypot(r.x-me.x,r.y-(me.y-8));const sc=d+(self<TKBLAST+TKTR+6?200:0);if(!best||sc<best.sc)best={a,p,sc};}
 return best||{a:135,p:60,sc:999};}
function TanksGame({stake,pool,payout,onEnd}){
 const cv=useRef(),endRef=useRef();endRef.current=onEnd;
 const G=useRef(null);
 if(!G.current){const h=tkGen(),first=Math.random()<.5?0:1;G.current={h,tank:[{x:TKX[0],y:tkH(h,TKX[0]),hp:100,ang:45,pow:55,dead:false},{x:TKX[1],y:tkH(h,TKX[1]),hp:100,ang:135,pow:55,dead:false}],turn:first,phase:first===0?'aim':'ai',proj:null,trail:[],boom:null,parts:[],floats:[],flash:null,over:false,ai:false,mark:[null,null],clouds:[30,150,260],api:{}};}
 const [ui,setUi]=useState({turn:G.current.turn,msg:G.current.turn===0?'You won the toss! Set your angle and power, then FIRE.':'Chidi O. won the toss and fires first…',over:false,hp:[100,100],ang:45,pow:55,tick:0});
 useEffect(()=>{
  const g=G.current,c=cv.current,ctx=c.getContext('2d');ctx.scale(2,2);

  const fire=(i)=>{const t=g.tank[i],[sx,sy]=tkMuzzle(t,t.ang),a=t.ang*Math.PI/180,v=t.pow/100*TKVMAX;g.proj={x:sx,y:sy,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,who:i};g.trail=[];g.phase='fly';sync((i?'Chidi O.':'You')+' fired! ('+Math.round(t.ang)+'°, '+Math.round(t.pow)+'%)');};

   for(let n=0;n<26;n++)g.parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4.5-.5,life:30+Math.random()*20,c:n%3?'#8B5A2B':'#F59E0B'});

    sync(w===0?'Both tanks destroyed — nobody wins. Stakes refunded.':w===1?'💥 Chidi O.’s tank is destroyed — you win!':'💥 Your tank is destroyed — Chidi O. wins!');setTimeout(()=>endRef.current(w),2600);return;}
   g.turn=1-g.turn;g.phase=g.turn===0?'aim':'ai';g.ai=false;sync(g.turn===0?'Your turn — adjust angle & power, then FIRE.':"Chidi O.'s turn…");};
  const aiPlay=()=>{if(g.over||g.turn!==1||g.phase!=='ai')return;const pl=tkPlan(g.h,g.tank[1],g.tank[0]);
   g.aiTarget={a:Math.max(2,Math.min(178,pl.a+(Math.random()+Math.random()+Math.random()-1.5)*2*3.8)),p:Math.max(15,Math.min(100,pl.p*(1+(Math.random()+Math.random()+Math.random()-1.5)*2*.06)))};g.phase='aiaim';g.aiT=0;};
  g.api={setAngle:v=>{if(g.phase!=='aim'||g.turn!==0)return;g.tank[0].ang=Math.max(0,Math.min(180,v));sync();},setPower:v=>{if(g.phase!=='aim'||g.turn!==0)return;g.tank[0].pow=Math.max(0,Math.min(100,v));sync();},fire:()=>{if(g.phase==='aim'&&g.turn===0)fire(0);}};
  const tankDraw=(t,i)=>{if(t.dead)return;const col=i?'#60A5FA':'#FFC83D',dk=i?'#1E3A8A':'#92400E',sl=Math.atan2(tkH(g.h,t.x+9)-tkH(g.h,t.x-9),18);
   ctx.save();ctx.translate(t.x,t.y);ctx.rotate(sl);ctx.fillStyle='#1F2937';ctx.beginPath();ctx.roundRect?ctx.roundRect(-15,-6,30,8,4):ctx.rect(-15,-6,30,8);ctx.fill();
   ctx.fillStyle='#374151';for(let k=-10;k<=10;k+=10){ctx.beginPath();ctx.arc(k,-2,2.6,0,7);ctx.fill();}
   ctx.fillStyle=col;ctx.strokeStyle=dk;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect?ctx.roundRect(-12,-14,24,10,4):ctx.rect(-12,-14,24,10);ctx.fill();ctx.stroke();ctx.restore();
   ctx.fillStyle=col;ctx.strokeStyle=dk;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(t.x,t.y-12,7,0,7);ctx.fill();ctx.stroke();
   const a=t.ang*Math.PI/180;ctx.strokeStyle=dk;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(t.x,t.y-12);ctx.lineTo(t.x+Math.cos(a)*19,t.y-12-Math.sin(a)*19);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.stroke();
   const w=34,x=t.x-w/2,y=t.y-40;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-1,y-1,w+2,7);ctx.fillStyle=t.hp>60?'#4ADE80':t.hp>30?'#FBBF24':'#EF4444';ctx.fillRect(x,y,w*t.hp/100,5);};

   ctx.fillStyle='rgba(120,160,200,.45)';ctx.beginPath();ctx.moveTo(0,330);[[40,260],[100,300],[160,240],[230,305],[290,255],[340,300]].forEach(([x,y])=>ctx.lineTo(x,y));ctx.lineTo(340,480);ctx.lineTo(0,480);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.85)';g.clouds=g.clouds.map(x=>(x+.12)%420);g.clouds.forEach((x,i)=>{const cx=x-40,cy=60+i*38;ctx.beginPath();ctx.arc(cx,cy,12,0,7);ctx.arc(cx+14,cy-5,15,0,7);ctx.arc(cx+30,cy,11,0,7);ctx.fill();});

   ctx.strokeStyle='#4ADE80';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();for(let x=0;x<TKW;x++)x?ctx.lineTo(x,g.h[x]):ctx.moveTo(x,g.h[x]);ctx.stroke();ctx.strokeStyle='#22C55E';ctx.lineWidth=2;ctx.stroke();
   g.tank.forEach((t,i)=>{if(i===0||true)tankDraw(t,i);});
   g.mark.forEach((m,i)=>{if(m){ctx.strokeStyle=i?'rgba(30,58,138,.8)':'rgba(146,64,14,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m[0]-4,m[1]-4);ctx.lineTo(m[0]+4,m[1]+4);ctx.moveTo(m[0]+4,m[1]-4);ctx.lineTo(m[0]-4,m[1]+4);ctx.stroke();}});
   if(g.trail.length){ctx.fillStyle='rgba(60,60,60,.45)';g.trail.forEach((p,i)=>{if(i%3===0){ctx.beginPath();ctx.arc(p[0],p[1],1.6,0,7);ctx.fill();}});}
   if(g.proj){ctx.beginPath();ctx.arc(g.proj.x,g.proj.y,3.6,0,7);ctx.fillStyle='#1F2937';ctx.fill();ctx.strokeStyle='#F59E0B';ctx.lineWidth=1.5;ctx.stroke();}
   if(g.boom&&g.boom.f<24){const b=g.boom,k=b.f/24,r=TKBLAST*(.5+k*.9);const gr=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,r);gr.addColorStop(0,'rgba(255,255,200,'+(1-k)+')');gr.addColorStop(.5,'rgba(251,146,60,'+(.9-k*.9)+')');gr.addColorStop(1,'rgba(220,38,38,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();}

   g.floats=g.floats.filter(f=>f.life>0);g.floats.forEach(f=>{f.y-=.5;f.life--;ctx.globalAlpha=Math.min(1,f.life/20);ctx.fillStyle='#EF4444';ctx.font='800 16px sans-serif';ctx.textAlign='center';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeText(f.t,f.x,f.y);ctx.fillText(f.t,f.x,f.y);ctx.globalAlpha=1;});
   if((g.phase==='ai'||g.phase==='aiaim')&&!g.over){const t=g.tank[1];ctx.fillStyle='rgba(0,0,0,.6)';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(t.ang)+'° · '+Math.round(t.pow)+'%',t.x,t.y-48);}

  let raf,last=performance.now(),acc=0;

    if(g.phase==='aiaim'){const t=g.tank[1],T=g.aiTarget;g.aiT++;t.ang+=(T.a-t.ang)*.1;t.pow+=(T.p-t.pow)*.1;if(g.aiT>50){t.ang=T.a;t.pow=T.p;fire(1);}}

     for(let s=0;s<3&&!done;s++){p.x+=p.vx/3;p.y+=p.vy/3;p.vy+=TKG/3;
      if(p.x<-10||p.x>TKW+10||p.y>TKH+30){const w=p.who;g.proj=null;g.mark[w]=null;g.phase='boom';g.boomT=26;g.boom=null;sync((w?'Chidi O.':'You')+' — shot flew off the map.');done=true;break;}
      let hitT=false;for(const t of g.tank){if(!t.dead&&Math.hypot(p.x-t.x,p.y-(t.y-7))<12)hitT=true;}

 },[]);

function App(){
