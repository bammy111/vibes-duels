   h('button',{onClick:()=>{setScr('start');setRes(null);},className:'mt-1 w-full py-2 text-sm font-semibold text-[#5C7467]'},'Change stake / top up'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
