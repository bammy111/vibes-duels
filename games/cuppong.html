<style>

.pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.up{animation:up .25s ease-out}

<body>
<div id="root"></div>
<script>
const {useState,useRef,useEffect}=React,h=React.createElement;
const d=(c,...k)=>h('div',{className:c},...k);
const money=n=>'₦'+Math.round(n).toLocaleString('en-NG');
const CPW=340,CPH=560,CPBX=170,CPBY=478,CPGRAV=.28,CPCUPH=22,CPR=18,CPRIN=14,CPROUT=21,CPVZ=6.5;
const cpScale=y=>.62+.38*Math.max(0,Math.min(1,(y-60)/460));
const cpRack=()=>{const c=[];[[110,[125,170,215]],[146,[147.5,192.5]],[182,[170]]].forEach(([y,xs])=>xs.forEach(x=>c.push({x,y,alive:true,dying:0})));return c;};
const cpOnTable=(x,y)=>{const t=Math.max(0,Math.min(1,(y-60)/500));return y>=60&&y<=CPH&&x>=70-80*t&&x<=270+80*t;};
const cpGauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const cpTrajRimTime=(CPVZ+Math.sqrt(CPVZ*CPVZ-2*CPGRAV*CPCUPH))/CPGRAV;
function CupPongGame({stake,pool,payout,onEnd}){
 const cv=useRef(),endRef=useRef();endRef.current=onEnd;
 const G=useRef(null);
 if(!G.current)G.current={cups:[cpRack(),cpRack()],turn:0,view:1,phase:'aim',ball:null,drag:null,aim:null,fx:[],over:false,ai:false};
 const [ui,setUi]=useState({turn:0,msg:'Your throw — drag back anywhere to aim, release to throw.',over:false,cups:[6,6],tick:0});
 useEffect(()=>{
  const g=G.current,c=cv.current,ctx=c.getContext('2d');ctx.scale(2,2);
  const alive=o=>g.cups[o].filter(x=>x.alive).length;
  const sync=m=>setUi(u=>({turn:g.turn,msg:m||u.msg,over:g.over,cups:[alive(0),alive(1)],tick:u.tick+1}));
  const traj=(vx,vy,vz)=>{const pts=[];let x=CPBX,y=CPBY,z=0,pz=0,vv=vz;for(let i=0;i<220;i++){pz=z;x+=vx;y+=vy;z+=vv;vv-=CPGRAV;pts.push([x,y,z]);if(pz>CPCUPH&&z<=CPCUPH&&vv<0)break;if(z<0)break;}return pts;};
  const fire=(vx,vy,vz)=>{g.ball={x:CPBX,y:CPBY,z:0,vx,vy,vz,live:true,pz:0,bounces:0,sunk:false,age:0,rim:false};g.phase='flight';g.aim=null;g.drag=null;};
  const end=()=>{if(g.phase!=='flight')return;g.phase='resolve';const sunk=g.ball.sunk,me=g.turn,tgt=1-me,who=me?'Chidi O.':'You';
   sync(sunk?(me?'💦 Chidi O. sank one of your cups!':'💦 SPLASH! You sank a cup!'):(g.ball.rim?who+(me?' hit the rim — no luck.':' hit the rim — no luck!'):who+(me?' missed.':' missed the cups.')));
   setTimeout(()=>{if(g.over)return;
    if(alive(tgt)===0){g.over=true;sync(me?'Chidi O. cleared all 6 of your cups!':'You cleared all 6 of Chidi O.\'s cups!');setTimeout(()=>endRef.current(me?2:1),2400);return;}
    g.turn=1-me;g.view=1-g.turn;g.phase=g.turn===0?'aim':'ai';g.ai=false;
    sync(g.turn===0?'Your throw — drag back anywhere to aim, release to throw.':"Chidi O.'s throw — your cups are the target");},sunk?1100:900);};
  const sink=cu=>{cu.alive=false;cu.dying=1;g.ball.live=false;g.ball.sunk=true;const s=cpScale(cu.y);for(let i=0;i<14;i++)g.fx.push({x:cu.x,y:cu.y-CPCUPH*s,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,life:30,col:g.view===1?'#FCA5A5':'#93C5FD'});end();};
  const stepBall=()=>{const b=g.ball;if(!b||!b.live)return;b.age++;b.pz=b.z;b.x+=b.vx;b.y+=b.vy;b.z+=b.vz;b.vz-=CPGRAV;
   for(const cu of g.cups[g.view]){if(!cu.alive)continue;const dx=b.x-cu.x,dy=b.y-cu.y,d=Math.hypot(dx,dy),nx=dx/(d||1),ny=dy/(d||1);
    if(b.pz>CPCUPH&&b.z<=CPCUPH&&b.vz<0){
     if(d<CPRIN){sink(cu);return;}
     if(d<CPROUT){b.vx=nx*2+b.vx*.3;b.vy=ny*2+b.vy*.3;b.vz=2.6;b.z=CPCUPH+1;b.rim=true;}}
    else if(b.z<CPCUPH&&d<CPROUT){b.x=cu.x+nx*CPROUT;b.y=cu.y+ny*CPROUT;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.7*vn*nx;b.vy-=1.7*vn*ny;}b.vx*=.8;b.vy*=.8;b.rim=true;}}
   if(b.z<=0&&b.vz<0&&cpOnTable(b.x,b.y)){b.z=0;b.vz=Math.abs(b.vz)*.55;b.vx*=.85;b.vy*=.85;b.bounces++;b.rim=true;if(b.vz<1.2)b.vz=0;}
   if(b.z===0&&b.vz===0){b.vx*=.97;b.vy*=.97;}
   if(b.z<-70||b.y<-30||b.y>CPH+40||b.x<-40||b.x>CPW+40||b.age>520||(b.z===0&&Math.hypot(b.vx,b.vy)<.35)){b.live=false;end();}};
  /* computer opponent: Chidi O. */
  const aiThrow=()=>{if(g.over||g.turn!==1||g.phase!=='ai')return;
   const tg=g.cups[0].filter(x=>x.alive),cu=tg[Math.floor(Math.random()*tg.length)];

  /* drawing */
  const drawCup=(cu,col)=>{const s=cpScale(cu.y),k=cu.dying?Math.max(0,1-cu.dying/22):1;if(k<=0)return;
   ctx.save();ctx.globalAlpha=k;ctx.translate(cu.x,cu.y);ctx.scale(s*k,s*k);const r=CPR,rb=r*.76,hh=CPCUPH;
   ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,2,rb+2,rb*.34,0,0,7);ctx.fill();
   ctx.fillStyle=col[0];ctx.beginPath();ctx.moveTo(-r,-hh);ctx.lineTo(r,-hh);ctx.lineTo(rb,0);ctx.lineTo(-rb,0);ctx.closePath();ctx.fill();
   ctx.beginPath();ctx.ellipse(0,0,rb,rb*.32,0,0,7);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.88)';const w1=r-(r-rb)*.45,w2=r-(r-rb)*.7;ctx.beginPath();ctx.moveTo(-w1,-hh*.55);ctx.lineTo(w1,-hh*.55);ctx.lineTo(w2,-hh*.3);ctx.lineTo(-w2,-hh*.3);ctx.closePath();ctx.fill();
   ctx.fillStyle=col[1];ctx.beginPath();ctx.ellipse(0,-hh,r,r*.34,0,0,7);ctx.fill();
   ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(0,-hh,r*.82,r*.27,0,0,7);ctx.fill();

  const drawBall=(x,y,z,s)=>{const sy=y-z*s;ctx.fillStyle='rgba(0,0,0,'+(.3*Math.max(0,1-z/130))+')';ctx.beginPath();ctx.ellipse(x,y,5.5*s,2.2*s,0,0,7);ctx.fill();
   ctx.beginPath();ctx.arc(x,sy,5.8*s,0,7);ctx.fillStyle='#FFF4E0';ctx.fill();ctx.strokeStyle='#F59E0B';ctx.lineWidth=1.3;ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x-1.6*s,sy-1.8*s,1.6*s,0,7);ctx.fill();};
  const guide=(vx,vy,vz,col)=>{const pts=traj(vx,vy,vz);ctx.fillStyle=col;
   pts.forEach(([x,y,z],i)=>{if(i%2===0&&i>2){const s=cpScale(y);ctx.beginPath();ctx.arc(x,y-z*s,2.1,0,7);ctx.fill();}});
   const[x,y,z]=pts[pts.length-1],s=cpScale(y);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-z*s,CPR*s*.8,CPR*s*.3,0,0,7);ctx.stroke();};
  const draw=()=>{
   ctx.fillStyle='#0A1812';ctx.fillRect(0,0,CPW,CPH);
   ctx.beginPath();ctx.moveTo(70,60);ctx.lineTo(270,60);ctx.lineTo(350,CPH);ctx.lineTo(-10,CPH);ctx.closePath();
   const gr=ctx.createLinearGradient(0,60,0,CPH);gr.addColorStop(0,'#0B5C80');gr.addColorStop(1,'#12739E');ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(170,60);ctx.lineTo(170,CPH);ctx.stroke();
   ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.moveTo(10,CPBY+16);ctx.lineTo(330,CPBY+16);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='bold 9px sans-serif';ctx.textAlign='left';ctx.fillText('THROW LINE',12,CPBY+27);
   const col=g.view===1?['#E11D48','#9F1239']:['#2563EB','#1E3A8A'],b=g.ball,flying=b&&b.live;
   const cups=g.cups[g.view].filter(x=>x.alive||x.dying<22);
   cups.filter(x=>!flying||x.y<=b.y).forEach(x=>drawCup(x,col));
   if(flying)drawBall(b.x,b.y,b.z,cpScale(b.y));else if(g.phase==='aim'||g.phase==='ai')drawBall(CPBX,CPBY,0,cpScale(CPBY));
   if(flying)cups.filter(x=>x.y>b.y).forEach(x=>drawCup(x,col));
   g.cups.forEach(r=>r.forEach(x=>{if(x.dying&&x.dying<22)x.dying++;}));
   g.fx=g.fx.filter(p=>p.life>0);g.fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,7);ctx.fill();ctx.globalAlpha=1;});
   if(g.phase==='aim'&&g.drag){const pullY=g.drag.cy-g.drag.sy,pullX=g.drag.sx-g.drag.cx;if(pullY>6){const p=Math.min(pullY/150,1),vx=Math.max(-2.6,Math.min(2.6,pullX*.024)),vy=-(3.5+6.5*p);
     guide(vx,vy,CPVZ,'rgba(255,255,255,.9)');ctx.fillStyle='#FFC83D';ctx.fillRect(12,CPH-24-p*170,6,p*170);
     ctx.strokeStyle='rgba(255,200,61,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(CPBX,CPBY);ctx.lineTo(CPBX-pullX*.5,CPBY+Math.min(pullY,150)*.5);ctx.stroke();}}
   if(g.phase==='ai'&&g.aim)guide(g.aim.vx,g.aim.vy,g.aim.vz,'rgba(252,165,165,.9)');};
  let raf,last=performance.now(),acc=0;
  const loop=now=>{acc+=Math.min(now-last,100);last=now;while(acc>=16.67){acc-=16.67;if(g.phase==='flight')stepBall();}
   if(g.phase==='ai'&&!g.ai&&!g.over){g.ai=true;setTimeout(aiThrow,800);}
   draw();raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*CPW/r.width,(e.clientY-r.top)*CPH/r.height];};
  c.onpointerdown=e=>{if(g.phase!=='aim'||g.over)return;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);g.drag={sx:x,sy:y,cx:x,cy:y};};
  c.onpointermove=e=>{if(!g.drag)return;const[x,y]=pos(e);g.drag.cx=x;g.drag.cy=y;};

  return()=>cancelAnimationFrame(raf);

 return d('p-3 space-y-2',
  d('flex items-center justify-between gap-2 rounded-2xl bg-[#12231B] px-3 py-2 text-white',d('flex items-center gap-1.5 text-sm font-extrabold','🔒 Escrow '+money(pool)),d('text-right text-[10px] leading-tight text-white/70',d('','Stake '+money(stake)+' each'),d('text-xs font-extrabold text-[#FFC83D]','Winner gets '+money(payout)))),
  d('flex items-center gap-2',
   d('flex-1 rounded-2xl bg-[#12231B] px-3 py-2 text-white transition '+(ui.turn===0?'ring-2 ring-[#FFC83D]':'opacity-70'),{}.k||'',h('div',{className:'rounded-2xl'},d('text-sm font-extrabold','You'),d('mb-0.5 text-[10px]','your cups'),cupRow(ui.cups[0],'#3B82F6'))),
   d('text-center text-[10px] font-extrabold text-[#5C7467]','VS'),
   d('flex-1 rounded-2xl bg-[#12231B] px-3 py-2 text-white transition '+(ui.turn===1?'ring-2 ring-[#FFC83D]':'opacity-70'),h('div',null,d('text-sm font-extrabold','Chidi O.'),d('mb-0.5 text-[10px]','his cups'),cupRow(ui.cups[1],'#F43F5E')))),
  d('relative',h('canvas',{ref:cv,width:CPW*2,height:CPH*2,style:{width:'100%',height:'auto',touchAction:'none',borderRadius:20,display:'block'},'aria-label':'Cup pong table'}),
   d('absolute left-2 top-2 rounded-full bg-black/55 px-2.5 py-1 text-[10px] font-extrabold text-white',ui.turn===0?'Target: Chidi O.’s red cups':'Target: your blue cups'),
   ui.over&&d('pop absolute inset-0 z-20 grid place-items-center rounded-[20px] bg-black/70',d('px-6 text-center text-xl font-extrabold text-white',ui.msg))),
  d('text-center text-sm font-semibold text-white',ui.msg));
}

const stamp=()=>new Date().toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'}),Lg=(mid,label,amt,kind)=>({id:Math.random().toString(36).slice(2),mid,t:stamp(),label,amt,kind});
function App(){
 const [bal,setBal]=useState(25000),[led,setLed]=useState([]),[mid,setMid]=useState(0),[stake,setStake]=useState(1000),[scr,setScr]=useState('start'),[res,setRes]=useState(null),[before,setBefore]=useState(0),[rules,setRules]=useState(false);
 const pool=stake*2,rake=pool*.05,payout=pool-rake;

  d('w-full rounded-3xl bg-white/10 p-4',d('mb-2 text-xs font-bold text-white/70','CHOOSE YOUR STAKE'),
   d('grid grid-cols-4 gap-2',...[500,1000,2000,5000].map(q=>h('button',{key:q,disabled:q>bal,onClick:()=>setStake(q),className:'rounded-xl border-2 py-3 text-sm font-extrabold disabled:opacity-30 '+(stake===q?'bg-[#FFC83D] text-[#12231B] border-[#FFC83D]':'border-white/25')},money(q)))),
